# 毎時：リサーチ → サイト更新（GitHub Pages）→ 下書き保存 → 承認済みを投稿
name: hourly-operations

on:
  schedule:
    - cron: "7 * * * *"      # 毎時7分（UTC）。混雑する0分を避ける
    # GitHubの定期実行は混雑時に数時間間引かれるため、投稿枠（20:00〜23:59 JST = 11〜14時 UTC）は
    # 10分おきに起動して、どれか1回が当たれば投稿できるようにする（1日1件の制限はコード側で担保）
    - cron: "3,13,23,33,43,53 11-14 * * *"
  workflow_dispatch: {}       # 手動実行ボタン
  # 外部からの確実な起動：Claudeのスケジュールタスクが毎日20:05 JSTに trigger/ を更新してpushする
  # （GitHubの定期実行は混雑時に数時間間引かれるため）。bot自身のpushではこの起動は発生しない
  push:
    branches: [main]
    paths: ["trigger/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-operations
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg > /dev/null
      - run: pip install -r requirements.txt

      - name: 自動チェック（テスト）
        run: pytest -q

      - name: リサーチ・編集・サイト生成・下書き作成
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
        run: python -m bot.cli run

      - name: 下書きと投稿記録を保存（価格は含まない）
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add drafts state
          git diff --cached --quiet || git commit -m "bot: drafts $(date -u +%FT%H%MZ)"
          git pull --rebase -q origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4

      - name: 最新の投稿記録を取得（並んで待っていた実行が二重投稿しないように）
        run: git pull --rebase -q origin main

      - name: 承認済み下書きを投稿
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot.cli publish

      - name: 投稿結果を保存
        run: |
          git add drafts state
          git diff --cached --quiet || git commit -m "bot: published $(date -u +%FT%H%MZ)"
          git pull --rebase -q origin main
          git push
