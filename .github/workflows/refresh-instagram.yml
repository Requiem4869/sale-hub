# 毎月1日・15日：Instagramの長期トークン（約60日）の有効期限を延長する
# 失敗した場合はGitHubからメール通知が届く → Secretの更新が必要
name: refresh-instagram-token
on:
  schedule:
    - cron: "17 0 1,15 * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: トークン延長
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot.cli refresh-ig
