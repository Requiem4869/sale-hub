- id: shoulder-strap
  approved: true
  reel_title: "斜めがけがきれいに見える長さ"
  caption: |
    斜めがけ、なんとなく野暮ったく見える原因はストラップの長さかもしれません。

    目安はこの2つ。
    ・斜めがけ → バッグが腰骨あたりに来る長さ
    ・肩がけ → バッグの上が脇の下あたり

    長すぎると、歩くたびに揺れて重心も下がって見えます。
    長さ調整できるストラップなら、コートを着る季節も合わせやすいです。
  hashtags: ["#ショルダーバッグ", "#斜めがけバッグ", "#バッグコーデ", "#レディースバッグ", "#大人カジュアル", "#休日コーデ"]
  slides:
