    - {type: point, num: "04", heading: "夕方の足を基準にする", body: "足は夕方になるとむくみやすく、朝よりも大きく感じることがあります。ぴったりすぎるサイズは避けるのが無難です。", point: "迷ったらレビューのサイズ感の声を参考に"}
