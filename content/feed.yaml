    - {type: point, num: "01", heading: "ヒールは低め・太めを選ぶ", body: "細くて高いヒールは足元が不安定になりがちです。通勤用なら、低めで太めのヒールのほうが安定して歩きやすくなります。", point: "長く歩く日はローヒールやフラットも候補に"}
    - {type: point, num: "02", heading: "つま先のゆとりを見る", body: "つま先が細すぎる形は、指が圧迫されて痛みの原因になります。指先を少し動かせるくらいの余裕がある形を選びましょう。", point: "ポインテッドトゥでも、先端に空間があるものを"}
