    - {type: rows, heading: "ちょうどいい位置", rows: [["斜め", "腰骨あたり", "長すぎると揺れて重心が下がる"], ["肩", "上端が脇の下あたり", "肩からずれにくい"]]}
    - {type: point, num: "TIP", heading: "冬は穴1つ分長く", body: "コートの上からだと窮屈になりやすい。", point: "長さ調整できるストラップが便利"}
